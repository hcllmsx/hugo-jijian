<div class="pan-actions">
  <div class="pan-side">
    <a class="pan-link" href="{{ .url }}" target="_blank" rel="noopener noreferrer nofollow" title="{{ .url }}">
      <span class="pan-link__icon" aria-hidden="true">🔗</span><span class="pan-link__url">{{ .url }}</span><span class="pan-link__label">下载链接</span>
    </a>
    <button type="button" class="pan-copy" data-copy="{{ .url }}" title="复制链接" aria-label="复制链接">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    {{- with .pwd }}
    <button type="button" class="pan-pwd" data-copy="{{ . }}" title="点击复制提取码">提取码&nbsp;<code>{{ . }}</code></button>
    {{- end }}
    {{- with .note }}<span class="pan-note">{{ . }}</span>{{ end }}
  </div>
</div>
